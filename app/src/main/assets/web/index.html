    async function uploadImageToImgBB(file, onProgress) {
      if (!file) throw new Error("No photo provided.");
      const formData = new FormData();
      formData.append("key", IMGBB_API_KEY);
      formData.append("image", file);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.upload.addEventListener("progress", (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(Math.round((e.loaded / e.total) * 100));
          }
        });
        xhr.addEventListener("load", () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              const res = JSON.parse(xhr.responseText);
              if (res.success && res.data) {
                resolve(res.data.display_url || res.data.url);
              } else {
                reject(new Error("ImgBB rejected upload: " + xhr.responseText));
              }
            } catch (e) {
              reject(new Error("Failed to parse ImgBB response."));
            }
          } else {
            try {
              const err = JSON.parse(xhr.responseText);
              reject(new Error(err.error?.message || `ImgBB error: ${xhr.status}`));
            } catch {
              reject(new Error(`ImgBB error HTTP ${xhr.status}`));
            }
          }
        });
        xhr.addEventListener("error", () => reject(new Error("Network connection error to ImgBB. Please retry.")));
        xhr.open("POST", IMGBB_ENDPOINT);
        xhr.send(formData);
      });
    }

      const [notifications, setNotifications] = useState([]);

      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [commentPost, setCommentPost] = useState(null);
      const [reportPost, setReportPost] = useState(null);
      const [isDark, setIsDark] = useState(() => localStorage.getItem('photonest_theme') === 'dark');

      // Theme toggle
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('photonest_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('photonest_theme', 'light');
        }
      }, [isDark]);

      // Firebase Auth listener
      useEffect(() => {
        const unsub = onAuthStateChanged(auth, async (user) => {
          if (user) {
            try {
              const snap = await get(ref(database, `users/${user.uid}`));
              if (snap.exists()) {
                setCurrentUser(snap.val());
              } else {
                setCurrentUser({
                  uid: user.uid,
                  email: user.email,
                  displayName: user.displayName || user.email.split('@')[0],
                  username: user.email.split('@')[0],
                  createdAt: Date.now()
                });
              }

              // Check if user is in /admins/{uid}
              const adminSnap = await get(ref(database, `admins/${user.uid}`));
              setIsAdmin(adminSnap.exists() && adminSnap.val() === true);
            } catch (e) {
              console.warn("Auth profile load error:", e);
            }
          } else {
            setCurrentUser(null);
            setIsAdmin(false);
            setSavedPosts([]);
            setNotifications([]);
          }
        });
        return () => unsub();
      }, []);

      // Realtime Posts listener
      useEffect(() => {
        setLoadingPosts(true);
        const postsRef = query(ref(database, 'posts'), orderByChild('createdAt'));
        const listener = onValue(postsRef, (snap) => {
          if (!snap.exists()) {
            setPosts([]);
            setLoadingPosts(false);
            return;
          }
          const val = snap.val();
          const list = Object.keys(val).map(k => ({ ...val[k], id: k }));
          list.sort((a, b) => b.createdAt - a.createdAt);
          setPosts(list);
          setLoadingPosts(false);
        });
        return () => off(postsRef, 'value', listener);
      }, []);

      // Saved posts & Notifications listeners
      useEffect(() => {
        if (!currentUser) return;

        const savedRef = ref(database, `savedPosts/${currentUser.uid}`);
        const sListener = onValue(savedRef, (snap) => {
          if (snap.exists()) setSavedPosts(Object.values(snap.val()));
          else setSavedPosts([]);
        });

        const notifRef = ref(database, `notifications/${currentUser.uid}`);
        const nListener = onValue(notifRef, (snap) => {
          if (snap.exists()) {
            const list = Object.keys(snap.val()).map(k => ({ ...snap.val()[k], id: k }));
            list.sort((a, b) => b.createdAt - a.createdAt);
            setNotifications(list);
          } else setNotifications([]);
        });

        return () => {
          off(savedRef, 'value', sListener);
          off(notifRef, 'value', nListener);
        };
      }, [currentUser]);

      const handleLogout = async () => {
        await signOut(auth);
        setCurrentTab('home');
      };

      const unreadCount = notifications.filter(n => !n.read).length;

      return React.createElement("div", { className: "min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100" },

              React.createElement("span", { className: "text-[10px] text-slate-400" }, new Date(notif.createdAt).toLocaleDateString())

          notif.postImage && React.createElement("img", { src: notif.postImage, className: "w-9 h-9 rounded-lg object-cover shrink-0 border" })
        ))

    }

    // --- PROFILE VIEW ---
    function ProfileView({ currentUser, posts, savedPosts, onSelectPost, onOpenSettings }) {
      const [tab, setTab] = useState('posts');
      const myPosts = posts.filter(p => p.authorId === currentUser.uid);
      const list = tab === 'posts' ? myPosts : savedPosts;

      return React.createElement("div", { className: "max-w-2xl mx-auto py-5 px-4 space-y-4" },
        // Header
        React.createElement("div", { className: "bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm" },
          React.createElement("div", { className: "flex items-center justify-between gap-4" },
            React.createElement("div", { className: "flex items-center gap-3" },
              React.createElement("img", {
                src: currentUser.avatarUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.username}`,

              React.createElement("div", null,

                React.createElement("p", { className: "text-xs text-slate-400" }, `@${currentUser.username}`),

              )

            React.createElement("button", { onClick: onOpenSettings, className: "p-2 rounded-2xl border text-slate-500" }, React.createElement(Icons.Settings, { className: "w-4 h-4" }))
          ),
          React.createElement("div", { className: "grid grid-cols-2 gap-2 mt-4 pt-3 border-t text-center" },
            React.createElement("div", { className: "p-2 bg-slate-50 dark:bg-slate-800/40 rounded-xl" },

              React.createElement("p", { className: "text-[10px] text-slate-400" }, "Photos")

            React.createElement("div", { className: "p-2 bg-slate-50 dark:bg-slate-800/40 rounded-xl" },
              React.createElement("p", { className: "font-bold text-base" }, savedPosts.length),
              React.createElement("p", { className: "text-[10px] text-slate-400" }, "Saved")

            onClick: () => setTab('posts'),
            className: `pb-2 ${tab === 'posts' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'}`

          React.createElement("button", {

            className: `pb-2 ${tab === 'saved' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-400'}`

          list.map(p => React.createElement("div", {
            key: p.id,
            onClick: () => onSelectPost(p),
            className: "aspect-square rounded-2xl overflow-hidden bg-black cursor-pointer shadow-sm hover:scale-[1.02] transition-transform"
          }, React.createElement("img", { src: p.imageUrl, className: "w-full h-full object-cover" })))
        )
      );
    }

    // --- ADMIN VIEW ---
    function AdminView({ currentUser, isAdmin, posts }) {
      const [reports, setReports] = useState([]);
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        if (!isAdmin) return;
        get(ref(database, 'reports')).then(snap => {
          if (snap.exists()) {
            const list = Object.keys(snap.val()).map(k => ({ ...snap.val()[k], id: k }));
            setReports(list);
          }
        });
      }, [isAdmin]);

      if (!isAdmin) {
        return React.createElement("div", { className: "max-w-md mx-auto py-8 px-4 text-center" },
          React.createElement("div", { className: "bg-white dark:bg-slate-900 rounded-3xl p-6 border border-rose-200 dark:border-rose-900/60 shadow-md" },
            React.createElement(Icons.ShieldCheck, { className: "w-10 h-10 text-rose-500 mx-auto mb-2" }),
            React.createElement("h2", { className: "font-bold text-sm" }, "Administrator Authorization Required"),
            React.createElement("p", { className: "text-xs text-slate-400 mt-1" }, "This view requires your account UID to be authorized in Firebase at /admins/{uid}."),
            React.createElement("div", { className: "mt-4 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-left" },
              React.createElement("p", { className: "text-[10px] text-slate-400 font-bold uppercase mb-1" }, "Your Firebase Auth UID:"),
              React.createElement("div", { className: "flex items-center justify-between font-mono text-xs text-indigo-500" },
                React.createElement("span", { className: "truncate" }, currentUser.uid),
                React.createElement("button", {
                  onClick: () => {
                    navigator.clipboard.writeText(currentUser.uid);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                  },
                  className: "ml-2 text-[11px] text-slate-400 hover:text-indigo-600 font-sans"
                }, copied ? "Copied" : "Copy")
              )
            ),
            React.createElement("p", { className: "text-[11px] text-slate-500 text-left mt-3" }, "Add this UID as a boolean key 'true' under 'admins' in your Firebase Realtime Database to gain owner access.")
          )
        );
      }

      return React.createElement("div", { className: "max-w-2xl mx-auto py-5 px-4 space-y-4" },
        React.createElement("div", { className: "flex items-center justify-between pb-3 border-b" },
          React.createElement("h2", { className: "font-bold text-base flex items-center gap-1.5" },
            React.createElement(Icons.ShieldCheck, { className: "w-5 h-5 text-amber-500" }),
            "Owner Admin Dashboard"
          ),
          React.createElement("span", { className: "text-xs px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 font-bold" }, "Authorized")
        ),
        React.createElement("div", { className: "grid grid-cols-2 gap-3" },
          React.createElement("div", { className: "p-4 rounded-2xl bg-white dark:bg-slate-900 border text-center" },
            React.createElement("p", { className: "font-bold text-xl" }, posts.length),
            React.createElement("p", { className: "text-xs text-slate-400" }, "Total Posts")
          ),
          React.createElement("div", { className: "p-4 rounded-2xl bg-white dark:bg-slate-900 border text-center" },
            React.createElement("p", { className: "font-bold text-xl text-amber-500" }, reports.length),
            React.createElement("p", { className: "text-xs text-slate-400" }, "Reported Items")
          )
        ),
        React.createElement("h3", { className: "font-bold text-xs uppercase text-slate-400 pt-2" }, "Reported Photos Queue"),
        reports.length === 0 ? React.createElement("div", { className: "p-6 rounded-2xl bg-white dark:bg-slate-900 border text-center text-xs text-slate-400" }, "No reports pending.")
        : reports.map(r => React.createElement("div", { key: r.id, className: "p-3 rounded-2xl bg-white dark:bg-slate-900 border flex items-center justify-between gap-3 text-xs" },
          React.createElement("div", null,
            React.createElement("p", { className: "font-bold text-rose-500" }, r.reason),
            React.createElement("p", { className: "text-slate-400 text-[10px]" }, `Reported by ${r.reportedByEmail}`)
          ),
          React.createElement("button", {
            onClick: async () => {
              await remove(ref(database, `posts/${r.postId}`));
              await remove(ref(database, `reports/${r.id}`));
              setReports(prev => prev.filter(x => x.id !== r.id));
            },
            className: "px-3 py-1 rounded-lg bg-rose-600 text-white font-bold text-xs"
          }, "Delete Post")
        ))
      );
    }

    // --- SETTINGS VIEW ---
    function SettingsView({ currentUser, isAdmin, isDark, onToggleTheme, onLogout, onOpenAuth }) {
      return React.createElement("div", { className: "max-w-md mx-auto py-5 px-4 space-y-4" },
        React.createElement("h2", { className: "font-bold text-base" }, "Settings"),
        React.createElement("div", { className: "p-4 rounded-2xl bg-white dark:bg-slate-900 border flex items-center justify-between" },
          React.createElement("div", null,
            React.createElement("p", { className: "font-bold text-xs" }, isDark ? "Dark Theme" : "Light Theme"),
            React.createElement("p", { className: "text-[11px] text-slate-400" }, "High contrast visual style")
          ),
          React.createElement("button", { onClick: onToggleTheme, className: "px-3 py-1.5 rounded-xl border text-xs font-semibold" }, "Toggle")
        ),
        currentUser ? React.createElement("button", {
          onClick: onLogout,
          className: "w-full py-2.5 rounded-2xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 text-xs font-bold border border-rose-200 dark:border-rose-900/40"
        }, "Sign Out") : React.createElement("button", {
          onClick: onOpenAuth,
          className: "w-full py-2.5 rounded-2xl bg-indigo-600 text-white text-xs font-bold"
        }, "Sign In")
      );
    }

    // --- COMMENTS DIALOG ---
    function CommentDialog({ post, currentUser, onClose, onOpenAuth }) {
      const [comments, setComments] = useState([]);
      const [text, setText] = useState('');

      useEffect(() => {
        const cRef = ref(database, `comments/${post.id}`);
        const unsub = onValue(cRef, snap => {
          if (snap.exists()) {
            const list = Object.keys(snap.val()).map(k => ({ ...snap.val()[k], id: k }));
            list.sort((a, b) => a.createdAt - b.createdAt);
            setComments(list);
          } else setComments([]);
        });
        return () => off(cRef, 'value', unsub);
      }, [post.id]);

      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!text.trim()) return;
        if (!currentUser) return onOpenAuth();

        const cRef = push(ref(database, `comments/${post.id}`));
        await set(cRef, {
          id: cRef.key,
          postId: post.id,
          authorId: currentUser.uid,
          authorName: currentUser.displayName,
          authorAvatar: currentUser.avatarUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${currentUser.username}`,
          text: text.trim(),
          createdAt: Date.now()
        });

        if (post.authorId !== currentUser.uid) {
          const notifRef = push(ref(database, `notifications/${post.authorId}`));
          await set(notifRef, {
            id: notifRef.key,
            userId: post.authorId,
            senderId: currentUser.uid,
            senderName: currentUser.displayName,
            senderAvatar: currentUser.avatarUrl,
            type: 'comment',
            postId: post.id,
            postImage: post.imageUrl,
            text: `commented: "${text.trim().slice(0, 30)}"`,
            createdAt: Date.now(),
            read: false
          });
        }

        setText('');
      };

      return React.createElement("div", { className: "fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4", onClick: onClose },
        React.createElement("div", { className: "bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl p-4 border flex flex-col max-h-[80vh]", onClick: e => e.stopPropagation() },
          React.createElement("div", { className: "flex justify-between items-center pb-2 border-b" },
            React.createElement("h3", { className: "font-bold text-xs" }, `Comments (${comments.length})`),
            React.createElement("button", { onClick: onClose }, React.createElement(Icons.X, { className: "w-4 h-4" }))
          ),
          React.createElement("div", { className: "flex-1 overflow-y-auto py-3 space-y-3" },
            comments.length === 0 ? React.createElement("p", { className: "text-center text-slate-400 text-xs py-6" }, "No comments yet.")
            : comments.map(c => React.createElement("div", { key: c.id, className: "flex items-start gap-2 text-xs" },
              React.createElement("img", { src: c.authorAvatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${c.authorName}`, className: "w-6 h-6 rounded-full object-cover shrink-0" }),
              React.createElement("div", { className: "bg-slate-50 dark:bg-slate-800 p-2 rounded-xl flex-1" },
                React.createElement("span", { className: "font-bold block" }, c.authorName),
                React.createElement("span", { className: "text-slate-700 dark:text-slate-300" }, c.text)
              )
            ))
          ),
          React.createElement("form", { onSubmit: handleAddComment, className: "flex gap-2 pt-2 border-t" },
            React.createElement("input", {
              type: "text",
              value: text,
              onChange: e => setText(e.target.value),
              placeholder: currentUser ? "Write a comment..." : "Sign in to comment",
              disabled: !currentUser,
              className: "flex-1 px-3 py-1.5 rounded-xl border text-xs bg-slate-50 dark:bg-slate-800"
            }),
            React.createElement("button", {
              type: "submit",
              disabled: !text.trim() || !currentUser,
              className: "p-2 rounded-xl bg-indigo-600 text-white disabled:opacity-40"
            }, React.createElement(Icons.Send, { className: "w-3.5 h-3.5" }))
          )
        )
      );
    }

    // --- REPORT DIALOG ---
    function ReportDialog({ post, currentUser, onClose, onOpenAuth }) {
      const [reason, setReason] = useState("Inappropriate content");

      const handleReport = async (e) => {
        e.preventDefault();
        if (!currentUser) return onOpenAuth();
        const rRef = push(ref(database, 'reports'));
        await set(rRef, {
          id: rRef.key,
          postId: post.id,
          postImageUrl: post.imageUrl,
          reportedByUid: currentUser.uid,
          reportedByEmail: currentUser.email,
          reason,
          createdAt: Date.now(),
          status: 'pending'
        });
        alert("Thank you. Report submitted for administrator moderation.");
        onClose();
      };

      return React.createElement("div", { className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4", onClick: onClose },
        React.createElement("div", { className: "bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl p-5 border", onClick: e => e.stopPropagation() },
          React.createElement("h3", { className: "font-bold text-sm mb-3" }, "Report Post"),
          React.createElement("form", { onSubmit: handleReport, className: "space-y-3 text-xs" },
            ["Inappropriate content", "Copyright violation", "Spam or abuse"].map(opt => React.createElement("label", { key: opt, className: "flex items-center gap-2 cursor-pointer" },
              React.createElement("input", { type: "radio", name: "r", checked: reason === opt, onChange: () => setReason(opt) }),
              React.createElement("span", null, opt)
            )),
            React.createElement("div", { className: "flex gap-2 pt-2" },
              React.createElement("button", { type: "button", onClick: onClose, className: "flex-1 py-2 border rounded-xl" }, "Cancel"),
              React.createElement("button", { type: "submit", className: "flex-1 py-2 bg-rose-600 text-white rounded-xl font-bold" }, "Submit")
            )
          )
        )
      );
    }

    // --- AUTH DIALOG ---
    function AuthDialog({ onClose }) {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [displayName, setDisplayName] = useState('');
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        setLoading(true);
        try {
          if (mode === 'login') {
            await signInWithEmailAndPassword(auth, email.trim(), password);
            onClose();
          } else if (mode === 'register') {
            const cleanUser = username.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
            if (!cleanUser) throw new Error("Please enter a username.");
            const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
            await updateProfile(cred.user, { displayName: displayName.trim() || cleanUser });

            await set(ref(database, `users/${cred.user.uid}`), {
              uid: cred.user.uid,
              email: cred.user.email,
              username: cleanUser,
              displayName: displayName.trim() || cleanUser,
              avatarUrl: `https://api.dicebear.com/7.x/identicon/svg?seed=${cleanUser}`,
              createdAt: Date.now()
            });
            await set(ref(database, `usernames/${cleanUser}`), cred.user.uid);
            onClose();
          } else if (mode === 'forgot') {
            await sendPasswordResetEmail(auth, email.trim());
            alert("Password reset link sent to your email!");
            setMode('login');
          }
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return React.createElement("div", { className: "fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4", onClick: onClose },
        React.createElement("div", { className: "bg-white dark:bg-slate-900 w-full max-w-sm rounded-3xl p-5 border", onClick: e => e.stopPropagation() },
          React.createElement("div", { className: "flex justify-between items-center mb-4" },
            React.createElement("span", { className: "font-extrabold text-sm text-indigo-600" }, "PhotoNest"),
            React.createElement("button", { onClick: onClose }, React.createElement(Icons.X, { className: "w-4 h-4" }))
          ),
          React.createElement("div", { className: "flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl mb-4 text-xs font-bold" },
            React.createElement("button", {
              type: "button",
              onClick: () => { setMode('login'); setError(null); },
              className: `flex-1 py-1.5 rounded-lg ${mode === 'login' ? 'bg-white dark:bg-slate-900 shadow-sm text-indigo-600' : 'text-slate-400'}`
            }, "Sign In"),
            React.createElement("button", {
              type: "button",
              onClick: () => { setMode('register'); setError(null); },
              className: `flex-1 py-1.5 rounded-lg ${mode === 'register' ? 'bg-white dark:bg-slate-900 shadow-sm text-indigo-600' : 'text-slate-400'}`
            }, "Register")
          ),
          error && React.createElement("div", { className: "mb-3 p-2 bg-rose-50 dark:bg-rose-950/40 text-rose-600 text-xs rounded-xl" }, error),
          React.createElement("form", { onSubmit: handleSubmit, className: "space-y-3 text-xs" },
            mode === 'register' && React.createElement(React.Fragment, null,
              React.createElement("input", {
                type: "text",
                value: displayName,
                onChange: e => setDisplayName(e.target.value),
                placeholder: "Display Name",
                required: true,
                className: "w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800"
              }),
              React.createElement("input", {
                type: "text",
                value: username,
                onChange: e => setUsername(e.target.value),
                placeholder: "Username (e.g. alex)",
                required: true,
                className: "w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800"
              })
            ),
            React.createElement("input", {
              type: "email",
              value: email,
              onChange: e => setEmail(e.target.value),
              placeholder: "Email address",
              required: true,
              className: "w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800"
            }),
            React.createElement("input", {
              type: "password",
              value: password,
              onChange: e => setPassword(e.target.value),
              placeholder: "Password",
              required: true,
              minLength: 6,
              className: "w-full p-2.5 rounded-xl border bg-slate-50 dark:bg-slate-800"
            }),
            React.createElement("button", {
              type: "submit",
              disabled: loading,
              className: "w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold"
            }, loading ? "Please wait..." : (mode === 'login' ? "Sign In" : "Create Account"))
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
